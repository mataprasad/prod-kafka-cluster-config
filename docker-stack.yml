version: "3.8"

# Deploy with:
#   docker node update --label-add kafka.node=1 <node-1>
#   docker node update --label-add kafka.node=2 <node-2>
#   docker node update --label-add kafka.node=3 <node-3>
#   export KAFKA_CLUSTER_ID="$(docker run --rm bitnami/kafka:3.7 kafka-storage.sh random-uuid)"
#   export KAFKA_1_ADVERTISED_HOST="<node-1-dns-or-ip>"
#   export KAFKA_2_ADVERTISED_HOST="<node-2-dns-or-ip>"
#   export KAFKA_3_ADVERTISED_HOST="<node-3-dns-or-ip>"
#   docker stack deploy -c docker-stack.yml kafka

networks:
  kafka:
    driver: overlay
    attachable: true

volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:

x-kafka-env: &kafka-env
  KAFKA_ENABLE_KRAFT: "yes"
  KAFKA_KRAFT_CLUSTER_ID: "${KAFKA_CLUSTER_ID}"
  KAFKA_CFG_PROCESS_ROLES: "broker,controller"
  KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
  KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CLIENT:PLAINTEXT,CONTROLLER:PLAINTEXT"
  KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_CFG_MIN_INSYNC_REPLICAS: "2"
  KAFKA_CFG_NUM_PARTITIONS: "3"
  ALLOW_PLAINTEXT_LISTENER: "yes"

x-kafka-deploy: &kafka-deploy
  replicas: 1
  restart_policy:
    condition: on-failure
    delay: 10s
    max_attempts: 5
  update_config:
    order: stop-first
    parallelism: 1

x-kafka-common: &kafka-common
  image: bitnami/kafka:3.7
  networks:
    - kafka
  environment:
    <<: *kafka-env
  deploy:
    <<: *kafka-deploy

services:
  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    volumes:
      - kafka_1_data:/bitnami/kafka
    ports:
      - target: 9092
        published: 9092
        protocol: tcp
        mode: host
    environment:
      <<: *kafka-env
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_LISTENERS: "INTERNAL://:9094,CLIENT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:9094,CLIENT://${KAFKA_1_ADVERTISED_HOST}:9092"
    deploy:
      <<: *kafka-deploy
      placement:
        constraints:
          - node.labels.kafka.node == 1

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    volumes:
      - kafka_2_data:/bitnami/kafka
    ports:
      - target: 9092
        published: 9092
        protocol: tcp
        mode: host
    environment:
      <<: *kafka-env
      KAFKA_CFG_NODE_ID: "2"
      KAFKA_CFG_LISTENERS: "INTERNAL://:9094,CLIENT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:9094,CLIENT://${KAFKA_2_ADVERTISED_HOST}:9092"
    deploy:
      <<: *kafka-deploy
      placement:
        constraints:
          - node.labels.kafka.node == 2

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    volumes:
      - kafka_3_data:/bitnami/kafka
    ports:
      - target: 9092
        published: 9092
        protocol: tcp
        mode: host
    environment:
      <<: *kafka-env
      KAFKA_CFG_NODE_ID: "3"
      KAFKA_CFG_LISTENERS: "INTERNAL://:9094,CLIENT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:9094,CLIENT://${KAFKA_3_ADVERTISED_HOST}:9092"
    deploy:
      <<: *kafka-deploy
      placement:
        constraints:
          - node.labels.kafka.node == 3
