version: "3.8"

# Deploy with:
#   docker node update --label-add kafka.node=1 <node-1>
#   docker node update --label-add kafka.node=2 <node-2>
#   docker node update --label-add kafka.node=3 <node-3>
#   export KAFKA_CLUSTER_ID="$(docker run --rm bitnami/kafka:3.7 kafka-storage.sh random-uuid)"
#   export KAFKA_1_ADVERTISED_HOST="<node-1-dns-or-ip>"
#   export KAFKA_2_ADVERTISED_HOST="<node-2-dns-or-ip>"
#   export KAFKA_3_ADVERTISED_HOST="<node-3-dns-or-ip>"
#   export KAFKA_CLIENT_USER="admin"
#   export KAFKA_CLIENT_PASSWORD="<strong-client-password>"
#   export KAFKA_INTER_BROKER_USER="broker"
#   export KAFKA_INTER_BROKER_PASSWORD="<strong-inter-broker-password>"
#   export KAFKA_CONTROLLER_USER="controller"
#   export KAFKA_CONTROLLER_PASSWORD="<strong-controller-password>"
#   docker stack deploy -c docker-stack.yml kafka
#
# Client connection properties:
#   security.protocol=SASL_PLAINTEXT
#   sasl.mechanism=PLAIN
#   sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="<strong-client-password>";

networks:
  kafka:
    driver: overlay
    attachable: true

volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:

x-kafka-env: &kafka-env
  KAFKA_ENABLE_KRAFT: "yes"
  KAFKA_KRAFT_CLUSTER_ID: "${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID is required}"
  KAFKA_CFG_PROCESS_ROLES: "broker,controller"
  KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
  KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:SASL_PLAINTEXT,CLIENT:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT"
  KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_CFG_SASL_ENABLED_MECHANISMS: "PLAIN"
  KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "PLAIN"
  KAFKA_CFG_SASL_MECHANISM_CONTROLLER_PROTOCOL: "PLAIN"
  KAFKA_CLIENT_USERS: "${KAFKA_CLIENT_USER:-admin}"
  KAFKA_CLIENT_PASSWORDS: "${KAFKA_CLIENT_PASSWORD:?KAFKA_CLIENT_PASSWORD is required}"
  KAFKA_INTER_BROKER_USER: "${KAFKA_INTER_BROKER_USER:-broker}"
  KAFKA_INTER_BROKER_PASSWORD: "${KAFKA_INTER_BROKER_PASSWORD:?KAFKA_INTER_BROKER_PASSWORD is required}"
  KAFKA_CONTROLLER_USER: "${KAFKA_CONTROLLER_USER:-controller}"
  KAFKA_CONTROLLER_PASSWORD: "${KAFKA_CONTROLLER_PASSWORD:?KAFKA_CONTROLLER_PASSWORD is required}"
  KAFKA_CFG_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
  KAFKA_CFG_SUPER_USERS: "User:${KAFKA_CLIENT_USER:-admin};User:${KAFKA_INTER_BROKER_USER:-broker};User:${KAFKA_CONTROLLER_USER:-controller}"
  KAFKA_CFG_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
  KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_CFG_MIN_INSYNC_REPLICAS: "2"
  KAFKA_CFG_NUM_PARTITIONS: "3"
  ALLOW_PLAINTEXT_LISTENER: "yes"

x-kafka-deploy: &kafka-deploy
  replicas: 1
  restart_policy:
    condition: on-failure
    delay: 10s
    max_attempts: 5
  update_config:
    order: stop-first
    parallelism: 1

x-kafka-common: &kafka-common
  image: bitnami/kafka:3.7
  networks:
    - kafka
  environment:
    <<: *kafka-env
  deploy:
    <<: *kafka-deploy

services:
  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    volumes:
      - kafka_1_data:/bitnami/kafka
    ports:
      - target: 9092
        published: 9092
        protocol: tcp
        mode: host
    environment:
      <<: *kafka-env
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_LISTENERS: "INTERNAL://:9094,CLIENT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:9094,CLIENT://${KAFKA_1_ADVERTISED_HOST:?KAFKA_1_ADVERTISED_HOST is required}:9092"
    deploy:
      <<: *kafka-deploy
      placement:
        constraints:
          - node.labels.kafka.node == 1

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    volumes:
      - kafka_2_data:/bitnami/kafka
    ports:
      - target: 9092
        published: 9092
        protocol: tcp
        mode: host
    environment:
      <<: *kafka-env
      KAFKA_CFG_NODE_ID: "2"
      KAFKA_CFG_LISTENERS: "INTERNAL://:9094,CLIENT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:9094,CLIENT://${KAFKA_2_ADVERTISED_HOST:?KAFKA_2_ADVERTISED_HOST is required}:9092"
    deploy:
      <<: *kafka-deploy
      placement:
        constraints:
          - node.labels.kafka.node == 2

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    volumes:
      - kafka_3_data:/bitnami/kafka
    ports:
      - target: 9092
        published: 9092
        protocol: tcp
        mode: host
    environment:
      <<: *kafka-env
      KAFKA_CFG_NODE_ID: "3"
      KAFKA_CFG_LISTENERS: "INTERNAL://:9094,CLIENT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:9094,CLIENT://${KAFKA_3_ADVERTISED_HOST:?KAFKA_3_ADVERTISED_HOST is required}:9092"
    deploy:
      <<: *kafka-deploy
      placement:
        constraints:
          - node.labels.kafka.node == 3
